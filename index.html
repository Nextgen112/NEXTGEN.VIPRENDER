<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ VIP Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <span class="brand">✨ VIP Manager</span>
  <div class="nav-links">
    <button id="clearAllBtn">Clear All</button>
  </div>
</nav>

<div class="container">
  <h2>Your VIPs</h2>
  <div id="vipList" class="vip-grid">
    <p class="empty">Loading...</p>
  </div>

  <div class="add-section">
    <h3>Add New VIP</h3>
    <form id="addVipForm" class="form-row">
      <div class="form-group">
        <label for="nameInput">Full Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Jane Doe" required />
      </div>
      <div class="form-group">
        <label for="roleInput">Role</label>
        <input type="text" id="roleInput" placeholder="e.g. CEO" value="VIP Member" />
      </div>
      <div class="form-group">
        <label for="levelInput">Level (1–5)</label>
        <input type="number" id="levelInput" min="1" max="5" value="1" required />
      </div>
      <button type="submit" class="btn">Add VIP</button>
    </form>
  </div>
</div>

<footer>
  &copy; 2026 VIP Manager &bull; Your data is stored locally in your browser.
</footer>

<script src="VIP.js"></script>
</body>
</html>
